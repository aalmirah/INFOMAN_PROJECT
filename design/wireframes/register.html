<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE Inc. ERP | Register</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="register-title">
        <header class="auth-header">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">H</span>
            <span>HOPE Inc. ERP</span>
          </a>
          <h1 id="register-title">Create your account</h1>
          <p>Join Hope Inc. ERP</p>
        </header>

        <form class="form-stack" action="#" method="post" aria-describedby="register-help">
          <p class="form-help" id="register-help">Enter your details to create your account.</p>
          <div class="register-name-fields">
            <div class="field">
              <label for="first-name">First name <span class="required" aria-hidden="true">*</span></label>
              <input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="Your first name" required>
            </div>
            <div class="field">
              <label for="last-name">Last name <span class="required" aria-hidden="true">*</span></label>
              <input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Your last name" required>
            </div>
          </div>
          <div class="field">
            <label for="register-email">Email address <span class="required" aria-hidden="true">*</span></label>
            <input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="register-password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-with-action">
              <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required aria-describedby="register-password-help">
              <button class="input-action" type="button" data-password-toggle="register-password" aria-controls="register-password" aria-label="Show password">Show</button>
            </div>
            <p class="form-help" id="register-password-help">Use at least 6 characters</p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-with-action">
              <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required>
              <button class="input-action" type="button" data-password-toggle="confirm-password" aria-controls="confirm-password" aria-label="Show confirmation password">Show</button>
            </div>
          </div>
          <label class="checkbox" for="terms">
            <input id="terms" name="terms" type="checkbox" required>
            I agree to the HOPE Inc. ERP terms and conditions.
          </label>
          <div class="form-actions">
            <button class="button-primary" type="submit">Register</button>
            <div class="form-divider" role="separator" aria-label="Or continue with Google">OR</div>
            <button class="sso-button" type="button">
              <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26Z"/>
                <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.5Z"/>
                <path fill="#FBBC05" d="M6.54 13.58a5.85 5.85 0 0 1 0-3.16V7.89H3.3a9.5 9.5 0 0 0 0 8.22l3.24-2.53Z"/>
                <path fill="#EA4335" d="M12 6.39c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.49 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39Z"/>
              </svg>
              Continue with Google
            </button>
          </div>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>
    <script>
      document.querySelectorAll("[data-password-toggle]").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const input = document.getElementById(toggle.dataset.passwordToggle);
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          toggle.textContent = isPassword ? "Hide" : "Show";
          toggle.setAttribute("aria-label", `${isPassword ? "Hide" : "Show"} password`);
        });
      });
    </script>
  </body>
</html>
