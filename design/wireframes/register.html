<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE, INC. | Register wireframe</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="auth-wireframe-page">
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="register-title">
        <header class="auth-header">
          <div class="wireframe-logo" aria-hidden="true">HOPE, INC.</div>
          <h1 id="register-title">Create your account</h1>
        </header>

        <form class="wireframe-form" data-auth-form="register">
          <div class="wireframe-name-row">
            <div class="field">
              <label for="first-name">First name</label>
              <input id="first-name" name="firstName" type="text" placeholder="First name" required>
            </div>
            <div class="field">
              <label for="last-name">Last name</label>
              <input id="last-name" name="lastName" type="text" placeholder="Last name" required>
            </div>
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" placeholder="name@example.com" required>
          </div>
          <button class="wireframe-button wireframe-button-primary" type="submit">Register</button>
          <button class="wireframe-button google-btn" type="button">
            <svg class="google-btn__logo" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.16 21.32 7.22 24 12 24z"/>
              <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.68 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <div class="form-alert" role="status" hidden></div>
        </form>

        <p class="auth-footer">Already registered? <a class="wireframe-link" href="login.html">Sign In</a></p>
      </section>
    </main>
    <script src="../js/script.js" defer></script>
  </body>
</html>
