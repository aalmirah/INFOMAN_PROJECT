<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE, INC. | Register wireframe</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="auth-wireframe-page">
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="register-title">
        <header class="auth-header">
          <div class="wireframe-logo" aria-hidden="true">HOPE, INC.</div>
          <h1 id="register-title">Create your account</h1>
        </header>

        <div class="wireframe-form">
          <div class="wireframe-name-row">
            <div class="field">
              <label for="first-name">First name</label>
              <input id="first-name" type="text" placeholder="First name" readonly>
            </div>
            <div class="field">
              <label for="last-name">Last name</label>
              <input id="last-name" type="text" placeholder="Last name" readonly>
            </div>
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" placeholder="name@example.com" readonly>
          </div>
          <button class="wireframe-button wireframe-button-primary" type="button" disabled>Register</button>
          <button class="wireframe-button" type="button" disabled>Continue with Google</button>
        </div>

        <p class="auth-footer">Already registered? <span class="wireframe-link">Sign In</span></p>
      </section>
    </main>
  </body>
</html>
