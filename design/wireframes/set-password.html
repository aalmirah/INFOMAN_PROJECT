<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE, INC. | Set password wireframe</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="auth-wireframe-page">
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="set-password-title">
        <header class="auth-header">
          <div class="wireframe-logo" aria-hidden="true">HOPE, INC.</div>
          <h1 id="set-password-title">Set a new password</h1>
        </header>

        <form class="wireframe-form" data-auth-form="set-password">
          <div class="field">
            <label for="new-password">New password</label>
            <div class="wireframe-input-action">
              <input id="new-password" name="password" type="password" placeholder="Enter a new password" required minlength="6">
              <button class="password-toggle" type="button" aria-controls="new-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <fieldset class="wireframe-requirements">
            <legend>Password requirements</legend>
            <label><input type="checkbox" data-password-rule disabled> At least 6 characters</label>
          </fieldset>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="wireframe-input-action">
              <input id="confirm-password" name="confirmPassword" type="password" placeholder="Re-enter your password" required minlength="6">
              <button class="password-toggle" type="button" aria-controls="confirm-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <button class="wireframe-button wireframe-button-primary" type="submit">Save new password</button>
          <div class="form-alert" role="status" hidden></div>
        </form>

        <p class="auth-footer"><a class="wireframe-link" href="login.html">Back to Sign In</a></p>
      </section>
    </main>
    <script src="../js/script.js" defer></script>
  </body>
</html>
