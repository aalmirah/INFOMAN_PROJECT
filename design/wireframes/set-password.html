<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE, INC. | Set password wireframe</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="auth-wireframe-page">
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="set-password-title">
        <header class="auth-header">
          <div class="wireframe-logo" aria-hidden="true">HOPE, INC.</div>
          <h1 id="set-password-title">Set a new password</h1>
        </header>

        <div class="wireframe-form">
          <div class="field">
            <label for="new-password">New password</label>
            <div class="wireframe-input-action">
              <input id="new-password" type="password" placeholder="Enter a new password" readonly>
              <span>Show</span>
            </div>
          </div>

          <fieldset class="wireframe-requirements">
            <legend>Password requirements</legend>
            <label><input type="checkbox" disabled> At least 6 characters</label>
          </fieldset>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="wireframe-input-action">
              <input id="confirm-password" type="password" placeholder="Re-enter your password" readonly>
              <span>Show</span>
            </div>
          </div>

          <button class="wireframe-button wireframe-button-primary" type="button" disabled>Save new password</button>
        </div>

        <p class="auth-footer"><span class="wireframe-link">Back to Sign In</span></p>
      </section>
    </main>
  </body>
</html>
