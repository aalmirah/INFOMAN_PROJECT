<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOPE, INC. | Forgot password wireframe</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="auth-wireframe-page">
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="reset-title">
        <header class="auth-header">
          <div class="wireframe-logo" aria-hidden="true">HOPE, INC.</div>
          <h1 id="reset-title">Forgot password?</h1>
          <p>Enter your email to request a reset link.</p>
        </header>

        <form class="wireframe-form" data-auth-form="reset">
          <div class="field">
            <label for="reset-email">Email</label>
            <input id="reset-email" name="email" type="email" placeholder="name@example.com" required>
          </div>
          <button class="wireframe-button wireframe-button-primary" type="submit">Send Reset Link</button>
          <a class="wireframe-link wireframe-back-link" href="login.html">Back to Sign In</a>
          <div class="form-alert" role="status" hidden></div>
        </form>

        <aside class="wireframe-callout wireframe-success" aria-label="Reset confirmation">
          <strong>SUCCESS:</strong>
          <span>Check your email. If an account matches that email, we'll send a reset link. Check spam and junk folders.</span>
        </aside>
      </section>
    </main>
    <script src="../js/script.js" defer></script>
  </body>
</html>
